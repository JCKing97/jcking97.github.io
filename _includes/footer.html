<div class="about-social">
    <ul class="social-links">
    {% for link in site.minima.social_links %}
        <li>
            <a href="{{ link.url }}" target="_blank" rel="noopener" aria-label="{{ link.title }}">
            {% if link.icon == "dove" %}
                <i class="fa-solid fa-dove" style="color: #D4D5A5;" aria-hidden="true"></i>
            {% else %}
                <i class="fa-brands fa-{{ link.icon }}" style="color: rgb(212, 213, 165);" aria-hidden="true"></i>
            {% endif %}
            </a>
        </li>
    {% endfor %}
    </ul>
</div>
