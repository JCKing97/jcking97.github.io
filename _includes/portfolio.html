<div class="portfolio-section">
    

    <div id="portfolio-carousel" class="portfolio-carousel">
        {% for post in site.posts %}
            {% if post.categories contains "portfolio" %}
                <div class="portfolio-item">
                    <div class="item-inner">
                        <div class="portfolio-image">
                            <a href="{{ post.url }}" class="portfolio-image-link">
                                <img src="/assets/images/portfolio/{{ post.img }}" alt="{{ post.title }}" />
                            </a>
                        </div>
                        <div class="portfolio-meta">
                            {% if forloop.first %}
                                {% include portfolio_intro.html %}
                            {% endif %}
                            <a href="{{ post.url }}" class="portfolio-link">
                                <h2 class="portfolio-title">{{ post.title }}</h2>
                                <p class="portfolio-excerpt">{{ post.excerpt }}</p>
                            </a>
                        </div>
                    </div>
                </div>
            {% endif %}
        {% endfor %}
    </div>
</div>
