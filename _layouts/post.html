---
layout: default
---

{% include header.html %}

<article class="post">

  <header class="post-header">
    <h1 class="post-title">{{ page.title | escape }}</h1>
  </header>

  <img class="post-image" src="/assets/images/portfolio/{{ page.img }}" alt="{{ page.title }}" />

  <p>{{ page.intro }}</p>

  <div class="post-content">
    {{ content }}
  </div>

</article>
