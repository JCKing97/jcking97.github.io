---
layout: default
---

{% include header.html %}

<article class="new-portfolio">
    <div class="new-portfolio-carousel-container">
        <div class="new-portfolio-carousel" role="region" aria-roledescription="carousel" aria-label="{{ page.title }} images" tabindex="0">

            <div class="new-portfolio-image-track">
            {% for portfolio_img in page.img %}
            <div class="new-portfolio-image-slide{% if forloop.first %} is-active{% endif %}">
                <div class="new-portfolio-image">
                    <img src="/assets/images/portfolio/{{ portfolio_img }}" alt="{{ page.title }}" />
                </div>
            </div>
            {% endfor %}
            </div>

            {% if page.img.size > 1 %}
            <button class="new-portfolio-control new-portfolio-prev" type="button" aria-label="Previous image">◀</button>
            <button class="new-portfolio-control new-portfolio-next" type="button" aria-label="Next image">▶</button>
            {% endif %}

        </div>
        <div class="new-portfolio-meta-slide">
            {{ content }}
        </div>
    </div>
    <div class="new-portfolio-dots" role="group" aria-label="Choose image">
        {% for portfolio_img in page.img %}
        <button class="new-portfolio-dot{% if forloop.first %} is-active{% endif %}" type="button" data-slide-index="{{ forloop.index0 }}" aria-label="Show image {{ forloop.index }}" aria-current="{% if forloop.first %}true{% else %}false{% endif %}"></button>
        {% endfor %}
    </div>
</article>


{% include footer.html %}

<script src="/assets/js/new_portfolio_carousel.js" defer></script>
